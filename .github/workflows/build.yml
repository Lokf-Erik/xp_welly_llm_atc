name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    tags:
      - 'v*'
  # Manual trigger for on-demand builds of the current branch — used by
  # `make ci-remote`. Produces the downloadable xp_wellys_atc-win artifact
  # without needing a PR or a release tag.
  workflow_dispatch:

# PR / dispatch builds are cloud-only on every platform
# (XPWELLYS_USE_LOCAL_INFERENCE=OFF): whisper.cpp / llama.cpp / Piper are
# neither downloaded nor linked, so nothing here needs the prebuilt bundle.
#
# TAG (release) builds are cloud-only for Windows, Linux and macOS-Intel
# (x86_64), but the macOS Apple Silicon (arm64) slice is built WITH local
# inference so the download release keeps offline STT/LM/TTS there. The
# universal macOS .xpl carries an arm64 slice (whisper + llama + Piper +
# cloud) and an x86_64 slice (cloud-only); Intel Macs load the x86_64 slice
# and never touch the arm64-only dylibs.
#
# Nothing in this workflow compiles whisper/llama/Piper any more: they are
# consumed prebuilt from the rwellinger/xp_wellys_libs bundle pinned by
# PREBUILT_LIBS_VERSION, which is what took the tag build from ~50 min to a
# few minutes. Local inference on Linux is a `make build` option for dev
# machines — the release stays cloud-only there — so build-linux carries a
# non-releasing link check to keep that path honest (see the job).

jobs:
  # ── Test gate (runs once) ───────────────────────────────────────────────
  # The engine OBJECT lib and the scenario REPL are SDK-free and platform-
  # agnostic, so the unit + scenario suites give the same result on any OS.
  # We run them once on Linux (cheaper/faster than the macOS runner). Both
  # build jobs depend on this — a red suite skips the expensive builds.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        # pkg-config + libpulse-dev are needed even for the test build: CMake
        # configures the whole project (incl. the plugin module's
        # pkg_check_modules(PULSE REQUIRED ...)) before building any target.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake pkg-config unzip \
            libcurl4-openssl-dev libssl-dev libpulse-dev

      - name: Setup dependencies (cloud-only — no bundle)
        run: make setup-cloud

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ github.job }}
          max-size: 1500M
          variant: ccache

      - name: Run tests (unit + scenarios)
        run: make test

  # ── macOS slice (universal) ─────────────────────────────────────────────
  # PR / dispatch: fast arm64 cloud-only compile check (no bundle). Tag:
  # universal arm64+x86_64 .xpl staged for the package job — the arm64 slice
  # is built WITH local inference (whisper + llama + Piper, consumed prebuilt
  # from the xp_wellys_libs bundle), the x86_64 slice cloud-only. On tag, the
  # local dylibs + espeak-ng-data are staged too.
  build-macos:
    # Also gate on verify-tag-on-main so a release tag that is NOT on main
    # never starts the universal arm64 local-inference build. The guard only
    # runs on tags (skipped on PR/dispatch), so the if-condition lets a
    # 'skipped' guard through (PR fast-check still runs) but blocks a
    # 'failure' (bad tag). !cancelled() is required so the job is still
    # evaluated when the guard was skipped rather than auto-skipped.
    needs: [test, verify-tag-on-main]
    if: >-
      !cancelled() &&
      needs.test.result == 'success' &&
      needs.verify-tag-on-main.result != 'failure'
    runs-on: macos-latest
    # Was unbounded (-> 360 min default) back when the tag build compiled
    # whisper/llama/ggml/Piper from source for ~50 min. Only the plugin's own
    # ~40 TUs compile now, so a run that exceeds this is hung, not slow.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Setup dependencies (cloud-only — no bundle)
        if: ${{ github.event_name == 'pull_request' }}
        run: make setup-cloud

      - name: Setup dependencies (downloads the prebuilt xp_wellys_libs bundle)
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        run: make setup

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          # Caches only the plugin's own ~40 TUs now (the heavy libs are
          # prebuilt), so a small static key is plenty.
          key: ${{ runner.os }}-${{ github.job }}
          max-size: 500M
          variant: ccache

      - name: Build (fast compile check, cloud-only)
        # PR / manual-dispatch runs only need to prove the macOS code compiles.
        # arm64 cloud-only finishes in a couple of minutes.
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          cmake -B build-mac-fast -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DXPWELLYS_USE_LOCAL_INFERENCE=OFF \
            -DBUILD_TESTS=OFF -Wno-dev
          cmake --build build-mac-fast --parallel --target xp_wellys_atc
          ccache --show-stats

      - name: Build (universal — arm64 local + x86_64 cloud)
        # Release tags: `make build` configures twice — arm64 with
        # XPWELLYS_USE_LOCAL_INFERENCE=ON (whisper + llama + Piper + cloud) and
        # x86_64 with it OFF (cloud-only) — then lipo's them into one universal
        # build/xp_wellys_atc.xpl and stages libpiper.dylib +
        # libonnxruntime.*.dylib next to it. -DRELEASE=ON bakes VERSION.txt
        # into both slices. Only the plugin's own TUs compile — whisper/llama/
        # Piper come prebuilt from the bundle `make setup` downloaded.
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          make build RELEASE_FLAG="-DRELEASE=ON"
          lipo -info build/xp_wellys_atc.xpl
          ccache --show-stats

      - name: Stage macOS slice
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          STAGE=dist/macos
          mkdir -p "$STAGE/mac_x64"
          mkdir -p "$STAGE/Resources/espeak-ng-data"

          # The arm64 slice resolves libpiper / libonnxruntime via @loader_path;
          # they are arm64-only and untouched by the x86_64 (cloud-only) slice
          # on Intel Macs.
          cp build/xp_wellys_atc.xpl           "$STAGE/mac_x64/"
          cp build/libpiper.dylib              "$STAGE/mac_x64/"
          cp build/libonnxruntime.1.22.0.dylib "$STAGE/mac_x64/"
          cp build/libonnxruntime.dylib        "$STAGE/mac_x64/"

          for rp in $(otool -l "$STAGE/mac_x64/xp_wellys_atc.xpl" \
                      | awk '/LC_RPATH/{flag=1; next} flag && /path/ {print $2; flag=0}'); do
            install_name_tool -delete_rpath "$rp" "$STAGE/mac_x64/xp_wellys_atc.xpl" 2>/dev/null || true
          done
          install_name_tool -add_rpath "@loader_path" "$STAGE/mac_x64/xp_wellys_atc.xpl"

          codesign --force --deep --sign - "$STAGE/mac_x64/libonnxruntime.1.22.0.dylib"
          codesign --force --deep --sign - "$STAGE/mac_x64/libpiper.dylib"
          codesign --force --deep --sign - "$STAGE/mac_x64/xp_wellys_atc.xpl"

          # espeak-ng-data is plain phoneme/dictionary data — identical on every
          # platform, so the single combined bundle carries one copy (from here).
          # It ships inside the prebuilt bundle now, not in a build tree.
          rsync -a --delete \
            "vendor/prebuilt/xp_wellys_libs-arm64-macos-$(cat PREBUILT_LIBS_VERSION)/share/espeak-ng-data/" \
            "$STAGE/Resources/espeak-ng-data/"

      - name: Upload macOS slice
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: slice-macos
          path: dist/macos
          retention-days: 1

  # ── Linux slice (Ubuntu 24.04, cloud-only) ──────────────────────────────
  # Builds the lin_x64 cloud-only .xpl and (on tag) stages it. The package
  # job merges this with the macOS + Windows slices.
  build-linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        # libgl1-mesa-dev provides <GL/gl.h> for ImGui's GL2 backend and
        # src/ui/atc_ui.cpp. libpulse-dev backs the mic-capture TU; libssl-dev
        # backs model_manifest's SHA256 (both compiled in cloud mode too).
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake pkg-config unzip \
            libcurl4-openssl-dev libssl-dev libpulse-dev \
            libgl1-mesa-dev

      - name: Setup dependencies (cloud-only — no bundle)
        run: make setup-cloud

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ github.job }}
          max-size: 1500M
          variant: ccache

      - name: Build (Linux, cloud-only)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DXPWELLYS_USE_LOCAL_INFERENCE=OFF \
            -DBUILD_TESTS=OFF -Wno-dev
          cmake --build build --parallel --target xp_wellys_atc
          ccache --show-stats

      - name: Local-inference link check (not released)
        # Linux releases cloud-only, but `make build` on a Linux dev box uses
        # the linux-x64 full bundle -- and no other job in this repo ever
        # consumes it, so without this the whole Linux local path would break
        # silently on the next pin bump and nobody would learn until a user
        # tried it. Cheap (~3-4 min: only the plugin's own TUs compile) purely
        # BECAUSE the libs are prebuilt. Uploads nothing, gates nothing.
        run: |
          make setup
          cmake -B build-local -DCMAKE_BUILD_TYPE=Release \
            -DXPWELLYS_USE_LOCAL_INFERENCE=ON \
            -DBUILD_TESTS=OFF -Wno-dev
          cmake --build build-local --parallel --target xp_wellys_atc
          # libpiper.so must resolve onnxruntime from its own directory, with
          # no LD_LIBRARY_PATH -- i.e. the bundle's $ORIGIN RUNPATH survived.
          ldd build-local/libpiper.so | grep onnxruntime
          ccache --show-stats

      - name: Stage Linux slice
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          STAGE=dist/linux
          mkdir -p "$STAGE/lin_x64"
          # Cloud-only: the .xpl is self-contained (libcurl is a system lib on
          # the target), so no bundled .so files.
          cp build/xp_wellys_atc.xpl "$STAGE/lin_x64/"

      - name: Upload Linux slice
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: slice-linux
          path: dist/linux
          retention-days: 1

  # ── Windows slice (windows-latest, cloud-only) ──────────────────────────
  # Native MSVC build (no cross-compile). Produces win_x64/xp_wellys_atc.xpl:
  # OpenAI + Mistral backends, WASAPI mic capture, Credential Manager secret
  # store. libcurl is linked statically (vcpkg x64-windows-static, Schannel
  # TLS) so the artefact ships zero extra DLLs. Uploads a ready-to-drop plugin
  # folder (xp_wellys_atc-win) on every run for `make win-artifact`.
  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up dependencies (SDK headers + Win libs, ImGui, json)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # X-Plane SDK — headers + Windows import libs. Mirror the paths
          # `make setup` extracts on mac/Linux, but via PowerShell since
          # GNU make / unzip aren't guaranteed on the Windows runner.
          Invoke-WebRequest -Uri "https://developer.x-plane.com/wp-content/plugins/code-sample-generation/sdk_zip_files/XPSDK430.zip" -OutFile sdk.zip
          Expand-Archive -Path sdk.zip -DestinationPath sdk_tmp -Force
          New-Item -ItemType Directory -Force -Path sdk/XPLM, sdk/XPWidgets, sdk/Libraries/Win | Out-Null
          Get-ChildItem -Recurse sdk_tmp -Filter *.h | Where-Object { $_.FullName -match 'CHeaders[\\/]XPLM' }    | Copy-Item -Destination sdk/XPLM/
          Get-ChildItem -Recurse sdk_tmp -Filter *.h | Where-Object { $_.FullName -match 'CHeaders[\\/]Widgets' } | Copy-Item -Destination sdk/XPWidgets/
          Get-ChildItem -Recurse sdk_tmp -Filter *.lib | Where-Object { $_.FullName -match 'Libraries[\\/]Win' }  | Copy-Item -Destination sdk/Libraries/Win/

          # Dear ImGui v1.91.9 (renderer + core TUs used by atc_ui).
          Invoke-WebRequest -Uri "https://github.com/ocornut/imgui/archive/refs/tags/v1.91.9.zip" -OutFile imgui.zip
          Expand-Archive -Path imgui.zip -DestinationPath imgui_tmp -Force
          $src = "imgui_tmp/imgui-1.91.9"
          New-Item -ItemType Directory -Force -Path vendor/imgui/backends | Out-Null
          Copy-Item "$src/imgui.h","$src/imgui.cpp","$src/imgui_draw.cpp","$src/imgui_tables.cpp","$src/imgui_widgets.cpp","$src/imgui_internal.h","$src/imconfig.h","$src/imstb_textedit.h","$src/imstb_rectpack.h","$src/imstb_truetype.h" -Destination vendor/imgui/
          Copy-Item "$src/backends/imgui_impl_opengl2.h","$src/backends/imgui_impl_opengl2.cpp" -Destination vendor/imgui/backends/

          # nlohmann/json single header.
          Invoke-WebRequest -Uri "https://github.com/nlohmann/json/releases/download/v3.11.3/json.hpp" -OutFile vendor/json.hpp

      - name: Install libcurl (static, Schannel TLS) via vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install curl:x64-windows-static

      - name: Configure + build (win_x64, cloud-only)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake -B build-win -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DXPWELLYS_USE_LOCAL_INFERENCE=OFF `
            -DBUILD_TESTS=OFF `
            -Wno-dev
          # Build just the plugin — atc_repl / atc_ifr_repl are dev tools not
          # shipped on Windows, and skipping them keeps the CI focused on the
          # deliverable .xpl.
          cmake --build build-win --config Release --target xp_wellys_atc

      - name: Stage Windows slice
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist/windows/win_x64 | Out-Null
          Copy-Item build-win/xp_wellys_atc.xpl dist/windows/win_x64/

      - name: Upload Windows slice
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: slice-windows
          path: dist/windows
          retention-days: 1

      # Ready-to-drop plugin folder for every run (PR / dispatch / tag), so
      # `make win-artifact` can pull a runnable Windows build without a
      # release. Cloud-only: just the .xpl + data/ (no Resources/models).
      - name: Assemble drop-in Windows plugin folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "dist-win/xp_wellys_atc"
          New-Item -ItemType Directory -Force -Path "$stage/win_x64","$stage/data/vrps" | Out-Null
          Copy-Item build-win/xp_wellys_atc.xpl "$stage/win_x64/"
          Copy-Item data/settings.json,data/models_catalog.json,data/atc_prompt_templates.json "$stage/data/"
          Copy-Item -Recurse data/atc_profiles "$stage/data/"
          Copy-Item data/vrps/airport_vrps.json "$stage/data/vrps/"

      - name: Upload drop-in Windows plugin (xp_wellys_atc-win)
        uses: actions/upload-artifact@v4
        with:
          name: xp_wellys_atc-win
          path: dist-win
          retention-days: 7

  # ── Release source guard ────────────────────────────────────────────────
  # A v* release tag MUST point at a commit that is contained in `main`. This
  # blocks publishing a release from a PR branch or any unmerged commit — such
  # a tag would ship code that never passed review / landed on main (possibly
  # broken). The tag must be created on main (typically `make release`, which
  # tags main's HEAD). Fails the release run otherwise; `package` needs this,
  # so a failure here means nothing is ever published.
  verify-tag-on-main:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0            # full history so ancestry can be computed
      - name: Assert tagged commit is contained in main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "OK: $GITHUB_SHA (tag ${GITHUB_REF_NAME}) is contained in main."
          else
            echo "::error::Tag ${GITHUB_REF_NAME} points at $GITHUB_SHA, which is NOT contained in main. Releases must be tagged on main. Refusing to publish."
            exit 1
          fi

  # ── Package + release (one combined bundle) ─────────────────────────────
  # Merges all three cloud-only platform slices with the shared data/ + docs/
  # into a single X-Plane plugin folder and publishes one release ZIP.
  # Runs on tag pushes only, and only once verify-tag-on-main confirms the tag
  # sits on main.
  package:
    needs: [verify-tag-on-main, build-macos, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        # data/ and docs/ come straight from the repo — no bundle needed.

      - name: Download macOS slice
        uses: actions/download-artifact@v4
        with:
          name: slice-macos
          path: slice-macos

      - name: Download Linux slice
        uses: actions/download-artifact@v4
        with:
          name: slice-linux
          path: slice-linux

      - name: Download Windows slice
        uses: actions/download-artifact@v4
        with:
          name: slice-windows
          path: slice-windows

      - name: Assemble combined bundle
        run: |
          set -euo pipefail
          STAGE=dist/xp_wellys_atc
          mkdir -p "$STAGE/data/vrps"
          mkdir -p "$STAGE/Resources/models"

          # Platform slices (X-Plane auto-loads the matching one at runtime).
          # mac_x64 carries the arm64 local-inference dylibs (libpiper +
          # libonnxruntime); lin_x64 and win_x64 are self-contained cloud-only
          # .xpl files with no dylibs/.so.
          cp -R slice-macos/mac_x64   "$STAGE/"
          cp -R slice-linux/lin_x64   "$STAGE/"
          cp -R slice-windows/win_x64 "$STAGE/"

          # Shared, platform-independent espeak-ng-data (from the macOS slice) —
          # backs Piper TTS in local mode on Apple Silicon.
          cp -R slice-macos/Resources/espeak-ng-data "$STAGE/Resources/"

          # Shared data + docs straight from the repo.
          cp data/atc_prompt_templates.json "$STAGE/data/"
          cp data/models_catalog.json       "$STAGE/data/"
          cp data/settings.json             "$STAGE/data/"
          # Whole atc_profiles tree so the EU vfr/ + ifr/ split (and any future
          # profile files) ship automatically.
          cp -R data/atc_profiles           "$STAGE/data/"
          cp data/vrps/airport_vrps.json    "$STAGE/data/vrps/"

          cp -r docs "$STAGE/docs"

          # SkunkCrafts Updater control files INTO the staged tree, BEFORE the
          # zip, so the release ZIP also carries skunkcrafts_updater.cfg (manual
          # installers become updater-discoverable). data/settings.json is
          # marked once-only (never overwritten on update); version from the tag
          # (v1.2.3 -> 1.2.3).
          python3 tools/skunkcrafts/generate.py \
            --tree "$STAGE" --version "${GITHUB_REF_NAME#v}"

          cd dist && zip -r xp_wellys_atc.zip xp_wellys_atc/

      - name: Create release with combined asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/xp_wellys_atc.zip
          generate_release_notes: true

      - name: Publish SkunkCrafts update tree
        # Force-push the staged plugin tree to the `release` branch that the
        # skunkcrafts_updater.cfg `module` URL serves via raw.githubusercontent.
        # Single orphan commit each release => the branch never accumulates
        # history (binaries don't bloat the repo over time). The bundle carries
        # the arm64 local-inference dylibs + espeak-ng-data (~50 MB), so in-sim
        # SkunkCrafts updates download that too. Requires repo Settings ->
        # Actions -> Workflow permissions -> "Read and write permissions".
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STAGE=dist/xp_wellys_atc
          pushd "$STAGE"
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "release ${GITHUB_REF_NAME}"
          git branch -M release
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" release
          popd
