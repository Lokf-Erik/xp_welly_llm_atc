name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    tags:
      - 'v*'
  # Manual trigger for on-demand builds of the current branch — used by
  # `make ci-remote`. Produces the downloadable xp_wellys_atc-win artifact
  # without needing a PR or a release tag.
  workflow_dispatch:

# CI builds cloud-only on every platform (XPWELLYS_USE_LOCAL_INFERENCE=OFF):
# the whisper.cpp / llama.cpp / Piper trees are neither fetched nor compiled,
# which cuts a ~50-min build to a few minutes. Released binaries therefore
# ship OpenAI + Mistral cloud backends only; local (offline) inference is a
# build-from-source option (`make build`), not part of the CI artifacts.

jobs:
  # ── Test gate (runs once) ───────────────────────────────────────────────
  # The engine OBJECT lib and the scenario REPL are SDK-free and platform-
  # agnostic, so the unit + scenario suites give the same result on any OS.
  # We run them once on Linux (cheaper/faster than the macOS runner). Both
  # build jobs depend on this — a red suite skips the expensive builds.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        # pkg-config + libpulse-dev are needed even for the test build: CMake
        # configures the whole project (incl. the plugin module's
        # pkg_check_modules(PULSE REQUIRED ...)) before building any target.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake pkg-config unzip \
            libcurl4-openssl-dev libssl-dev libpulse-dev

      - name: Setup dependencies (cloud-only — no submodules)
        run: make setup-cloud

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ github.job }}
          max-size: 1500M
          variant: ccache

      - name: Run tests (unit + scenarios)
        run: make test

  # ── macOS slice (universal, cloud-only) ─────────────────────────────────
  # PR / dispatch: fast arm64 compile check. Tag: universal arm64+x86_64
  # cloud-only .xpl (runs on both Apple Silicon and Intel Macs), staged for
  # the package job. No local-inference dylibs, no espeak-ng-data.
  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup dependencies (cloud-only — no submodules)
        run: make setup-cloud

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ github.job }}
          max-size: 1500M
          variant: ccache

      - name: Build (fast compile check, cloud-only)
        # PR / manual-dispatch runs only need to prove the macOS code compiles.
        # arm64 cloud-only finishes in a couple of minutes.
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          cmake -B build-mac-fast -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DXPWELLYS_USE_LOCAL_INFERENCE=OFF \
            -DBUILD_TESTS=OFF -Wno-dev
          cmake --build build-mac-fast --parallel --target xp_wellys_atc
          ccache --show-stats

      - name: Build (universal, cloud-only)
        # Release tags: build both arches cloud-only and lipo them into one
        # universal .xpl. Both slices are fast (libcurl + frameworks only).
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          for arch in arm64 x86_64; do
            cmake -B "build-$arch" -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES="$arch" \
              -DXPWELLYS_USE_LOCAL_INFERENCE=OFF \
              -DBUILD_TESTS=OFF -Wno-dev
            cmake --build "build-$arch" --parallel --target xp_wellys_atc
          done
          mkdir -p build
          lipo -create \
            build-arm64/xp_wellys_atc.xpl \
            build-x86_64/xp_wellys_atc.xpl \
            -output build/xp_wellys_atc.xpl
          lipo -info build/xp_wellys_atc.xpl
          ccache --show-stats

      - name: Stage macOS slice
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          STAGE=dist/macos
          mkdir -p "$STAGE/mac_x64"
          cp build/xp_wellys_atc.xpl "$STAGE/mac_x64/"
          # Cloud-only: no bundled dylibs to resolve, so just ad-hoc codesign
          # the self-contained .xpl (Gatekeeper still wants a signature).
          codesign --force --sign - "$STAGE/mac_x64/xp_wellys_atc.xpl"

      - name: Upload macOS slice
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: slice-macos
          path: dist/macos
          retention-days: 1

  # ── Linux slice (Ubuntu 24.04, cloud-only) ──────────────────────────────
  # Builds the lin_x64 cloud-only .xpl and (on tag) stages it. The package
  # job merges this with the macOS + Windows slices.
  build-linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        # libgl1-mesa-dev provides <GL/gl.h> for ImGui's GL2 backend and
        # src/ui/atc_ui.cpp. libpulse-dev backs the mic-capture TU; libssl-dev
        # backs model_manifest's SHA256 (both compiled in cloud mode too).
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake pkg-config unzip \
            libcurl4-openssl-dev libssl-dev libpulse-dev \
            libgl1-mesa-dev

      - name: Setup dependencies (cloud-only — no submodules)
        run: make setup-cloud

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ github.job }}
          max-size: 1500M
          variant: ccache

      - name: Build (Linux, cloud-only)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DXPWELLYS_USE_LOCAL_INFERENCE=OFF \
            -DBUILD_TESTS=OFF -Wno-dev
          cmake --build build --parallel --target xp_wellys_atc
          ccache --show-stats

      - name: Stage Linux slice
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          STAGE=dist/linux
          mkdir -p "$STAGE/lin_x64"
          # Cloud-only: the .xpl is self-contained (libcurl is a system lib on
          # the target), so no bundled .so files.
          cp build/xp_wellys_atc.xpl "$STAGE/lin_x64/"

      - name: Upload Linux slice
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: slice-linux
          path: dist/linux
          retention-days: 1

  # ── Windows slice (windows-latest, cloud-only) ──────────────────────────
  # Native MSVC build (no cross-compile). Produces win_x64/xp_wellys_atc.xpl:
  # OpenAI + Mistral backends, WASAPI mic capture, Credential Manager secret
  # store. libcurl is linked statically (vcpkg x64-windows-static, Schannel
  # TLS) so the artefact ships zero extra DLLs. Uploads a ready-to-drop plugin
  # folder (xp_wellys_atc-win) on every run for `make win-artifact`.
  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up dependencies (SDK headers + Win libs, ImGui, json)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # X-Plane SDK — headers + Windows import libs. Mirror the paths
          # `make setup` extracts on mac/Linux, but via PowerShell since
          # GNU make / unzip aren't guaranteed on the Windows runner.
          Invoke-WebRequest -Uri "https://developer.x-plane.com/wp-content/plugins/code-sample-generation/sdk_zip_files/XPSDK430.zip" -OutFile sdk.zip
          Expand-Archive -Path sdk.zip -DestinationPath sdk_tmp -Force
          New-Item -ItemType Directory -Force -Path sdk/XPLM, sdk/XPWidgets, sdk/Libraries/Win | Out-Null
          Get-ChildItem -Recurse sdk_tmp -Filter *.h | Where-Object { $_.FullName -match 'CHeaders[\\/]XPLM' }    | Copy-Item -Destination sdk/XPLM/
          Get-ChildItem -Recurse sdk_tmp -Filter *.h | Where-Object { $_.FullName -match 'CHeaders[\\/]Widgets' } | Copy-Item -Destination sdk/XPWidgets/
          Get-ChildItem -Recurse sdk_tmp -Filter *.lib | Where-Object { $_.FullName -match 'Libraries[\\/]Win' }  | Copy-Item -Destination sdk/Libraries/Win/

          # Dear ImGui v1.91.9 (renderer + core TUs used by atc_ui).
          Invoke-WebRequest -Uri "https://github.com/ocornut/imgui/archive/refs/tags/v1.91.9.zip" -OutFile imgui.zip
          Expand-Archive -Path imgui.zip -DestinationPath imgui_tmp -Force
          $src = "imgui_tmp/imgui-1.91.9"
          New-Item -ItemType Directory -Force -Path vendor/imgui/backends | Out-Null
          Copy-Item "$src/imgui.h","$src/imgui.cpp","$src/imgui_draw.cpp","$src/imgui_tables.cpp","$src/imgui_widgets.cpp","$src/imgui_internal.h","$src/imconfig.h","$src/imstb_textedit.h","$src/imstb_rectpack.h","$src/imstb_truetype.h" -Destination vendor/imgui/
          Copy-Item "$src/backends/imgui_impl_opengl2.h","$src/backends/imgui_impl_opengl2.cpp" -Destination vendor/imgui/backends/

          # nlohmann/json single header.
          Invoke-WebRequest -Uri "https://github.com/nlohmann/json/releases/download/v3.11.3/json.hpp" -OutFile vendor/json.hpp

      - name: Install libcurl (static, Schannel TLS) via vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install curl:x64-windows-static

      - name: Configure + build (win_x64, cloud-only)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake -B build-win -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DXPWELLYS_USE_LOCAL_INFERENCE=OFF `
            -DBUILD_TESTS=OFF `
            -Wno-dev
          # Build just the plugin — atc_repl / atc_ifr_repl are dev tools not
          # shipped on Windows, and skipping them keeps the CI focused on the
          # deliverable .xpl.
          cmake --build build-win --config Release --target xp_wellys_atc

      - name: Stage Windows slice
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist/windows/win_x64 | Out-Null
          Copy-Item build-win/xp_wellys_atc.xpl dist/windows/win_x64/

      - name: Upload Windows slice
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: slice-windows
          path: dist/windows
          retention-days: 1

      # Ready-to-drop plugin folder for every run (PR / dispatch / tag), so
      # `make win-artifact` can pull a runnable Windows build without a
      # release. Cloud-only: just the .xpl + data/ (no Resources/models).
      - name: Assemble drop-in Windows plugin folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "dist-win/xp_wellys_atc"
          New-Item -ItemType Directory -Force -Path "$stage/win_x64","$stage/data/vrps" | Out-Null
          Copy-Item build-win/xp_wellys_atc.xpl "$stage/win_x64/"
          Copy-Item data/settings.json,data/models_catalog.json,data/atc_prompt_templates.json "$stage/data/"
          Copy-Item -Recurse data/atc_profiles "$stage/data/"
          Copy-Item data/vrps/airport_vrps.json "$stage/data/vrps/"

      - name: Upload drop-in Windows plugin (xp_wellys_atc-win)
        uses: actions/upload-artifact@v4
        with:
          name: xp_wellys_atc-win
          path: dist-win
          retention-days: 7

  # ── Package + release (one combined bundle) ─────────────────────────────
  # Merges all three cloud-only platform slices with the shared data/ + docs/
  # into a single X-Plane plugin folder and publishes one release ZIP.
  # Runs on tag pushes only.
  package:
    needs: [build-macos, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        # data/ and docs/ come straight from the repo — no submodules needed.

      - name: Download macOS slice
        uses: actions/download-artifact@v4
        with:
          name: slice-macos
          path: slice-macos

      - name: Download Linux slice
        uses: actions/download-artifact@v4
        with:
          name: slice-linux
          path: slice-linux

      - name: Download Windows slice
        uses: actions/download-artifact@v4
        with:
          name: slice-windows
          path: slice-windows

      - name: Assemble combined bundle
        run: |
          set -euo pipefail
          STAGE=dist/xp_wellys_atc
          mkdir -p "$STAGE/data/vrps"

          # Platform slices (X-Plane auto-loads the matching one at runtime).
          # Cloud-only: each is a single self-contained .xpl, no dylibs/.so.
          cp -R slice-macos/mac_x64   "$STAGE/"
          cp -R slice-linux/lin_x64   "$STAGE/"
          cp -R slice-windows/win_x64 "$STAGE/"

          # Shared data + docs straight from the repo.
          cp data/atc_prompt_templates.json "$STAGE/data/"
          cp data/models_catalog.json       "$STAGE/data/"
          cp data/settings.json             "$STAGE/data/"
          # Whole atc_profiles tree so the EU vfr/ + ifr/ split (and any future
          # profile files) ship automatically.
          cp -R data/atc_profiles           "$STAGE/data/"
          cp data/vrps/airport_vrps.json    "$STAGE/data/vrps/"

          cp -r docs "$STAGE/docs"

          # SkunkCrafts Updater control files INTO the staged tree, BEFORE the
          # zip, so the release ZIP also carries skunkcrafts_updater.cfg (manual
          # installers become updater-discoverable). data/settings.json is
          # marked once-only (never overwritten on update); version from the tag
          # (v1.2.3 -> 1.2.3).
          python3 tools/skunkcrafts/generate.py \
            --tree "$STAGE" --version "${GITHUB_REF_NAME#v}"

          cd dist && zip -r xp_wellys_atc.zip xp_wellys_atc/

      - name: Create release with combined asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/xp_wellys_atc.zip
          generate_release_notes: true

      - name: Publish SkunkCrafts update tree
        # Force-push the staged plugin tree to the `release` branch that the
        # skunkcrafts_updater.cfg `module` URL serves via raw.githubusercontent.
        # Single orphan commit each release => the branch never accumulates
        # history (binaries don't bloat the repo over time). Cloud-only bundle,
        # so nothing large to strip first. Requires repo Settings -> Actions ->
        # Workflow permissions -> "Read and write permissions".
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STAGE=dist/xp_wellys_atc
          pushd "$STAGE"
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "release ${GITHUB_REF_NAME}"
          git branch -M release
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" release
          popd
